<!DOCTYPE html>
<html>
<head>
    <title>AI Interview Assistant</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
</head>
<body>

<div id="particles-js"></div>

<div class="container">

    <div class="header">
        <div class="robot">🤖</div>
        <h1>AI Interview Assistant</h1>
        <p class="subtitle">Practice technical interviews with AI-powered feedback</p>
    </div>

    <div class="input-card">
        <div class="input-group">
            <div class="field">
                <label>Role</label>
                <input type="text" id="role" placeholder="e.g. Backend Developer">
            </div>
            <div class="field">
                <label>Level</label>
                <select id="level">
                    <option value="Beginner">Beginner</option>
                    <option value="Intermediate" selected>Intermediate</option>
                    <option value="Senior">Senior</option>
                    <option value="Lead">Lead</option>
                </select>
            </div>
            <button onclick="generateQuestions()" id="genBtn">
                <span>Generate</span>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            </button>
        </div>
    </div>

    <div id="questions"></div>

</div>

<script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
<script>

async function generateQuestions() {
    const role  = document.getElementById("role").value.trim();
    const level = document.getElementById("level").value;
    if (!role) { alert("Please enter a role."); return; }

    const btn = document.getElementById("genBtn");
    btn.disabled = true;
    btn.innerHTML = `<span class="dots"><span></span><span></span><span></span></span>`;

    const list = document.getElementById("questions");
    list.innerHTML = `<div class="loading-state"><span class="dots"><span></span><span></span><span></span></span><p>Generating questions…</p></div>`;

    try {
        const r1    = await fetch("/start-interview", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ role, level }) });
        const d1    = await r1.json();
        const qRes  = await fetch(`/generate-questions/${d1.session_id}`);
        const qData = await qRes.json();

        list.innerHTML = "";
        qData.questions.filter(q => q && q.length > 5).forEach((q, i) => {
            const div = document.createElement("div");
            div.className = "question-card";
            div.style.animationDelay = `${i * 0.08}s`;
            div.innerHTML = `
                <div class="q-meta">
                    <span class="q-badge">Q${i+1}</span>
                    <p class="q-text">${q}</p>
                </div>
                <textarea placeholder="Type your answer here…"></textarea>
                <button class="btn-eval" onclick="evaluateAnswer('${q.replace(/'/g,"\\'")}', this)">
                    <span>Evaluate Answer</span>
                </button>
                <div class="result"></div>
            `;
            list.appendChild(div);
        });
    } catch(e) {
        list.innerHTML = `<div class="error-state">⚠️ Something went wrong: ${e.message}</div>`;
    } finally {
        btn.disabled = false;
        btn.innerHTML = `<span>Generate</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>`;
    }
}

async function evaluateAnswer(question, btn) {
    const textarea = btn.previousElementSibling;
    const answer   = textarea.value.trim();
    if (!answer) { alert("Please type an answer first."); return; }

    btn.disabled = true;
    btn.innerHTML = `<span class="dots"><span></span><span></span><span></span></span>`;

    const resultDiv = btn.nextElementSibling;
    resultDiv.innerHTML = "";

    try {
        const res  = await fetch("/evaluate-answer", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ question, answer }) });
        const data = await res.json();
        const text = data.result || "";

        const scoreMatch = text.match(/score[:\s]*(\d+)\s*\/\s*10/i);
        const scorePart  = scoreMatch ? `<div class="score-chip">⭐ Score: ${scoreMatch[1]} / 10</div>` : "";

        const formatted = text
            .replace(/\*\*Evaluation\*\*/gi, "")
            .replace(/\*\*Score.*?\*\*/gi, "")
            .replace(/\*\*Feedback:\*\*/gi,    `<span class="tag feedback-tag">Feedback</span>`)
            .replace(/\*\*Improvement:\*\*/gi, `<span class="tag improve-tag">Improvement</span>`)
            .replace(/\* /g, "• ")
            .replace(/\n/g, "<br/>");

        resultDiv.innerHTML = `
            <div class="eval-box">
                <div class="eval-top">
                    <span class="eval-pill">AI Evaluation</span>
                    ${scorePart}
                </div>
                <div class="eval-content">${formatted}</div>
            </div>`;
    } catch(e) {
        resultDiv.innerHTML = `<p class="error-state">⚠️ ${e.message}</p>`;
    } finally {
        btn.disabled = false;
        btn.innerHTML = `<span>Evaluate Answer</span>`;
    }
}

particlesJS("particles-js", {
  particles: {
    number: { value: 60 },
    color:  { value: ["#38bdf8","#818cf8"] },
    shape:  { type: "circle" },
    opacity:{ value: 0.35, random: true },
    size:   { value: 2.5, random: true },
    line_linked: { enable: true, distance: 130, color: "#38bdf8", opacity: 0.1, width: 1 },
    move:   { enable: true, speed: 1.4 }
  },
  interactivity: {
    detect_on: "canvas",
    events: { onhover: { enable: true, mode: "grab" }, onclick: { enable: true, mode: "push" } },
    modes:  { grab: { distance: 140, line_linked: { opacity: 0.35 } }, push: { particles_nb: 2 } }
  }
});
</script>

</body>
</html>
